# dPeluChe hooks: central lefthook config, consumed via lefthook `remotes`.
#
# Consumer repos point at this file from their lefthook.yml (or
# lefthook-local.yml on team repos); `flowkit hooks` writes that:
#
#   remotes:
#     - git_url: https://github.com/dPeluChe/skills
#       ref: main
#       refetch_frequency: 24h
#       configs:
#         - hooks/lefthook-base.yml
#
# Every job is a POSIX sh script in .lefthook/<hook>/ of this repo, served from
# the same remote clone; .lefthook/lib/common.sh holds the shared parsing.
# Script `args` need lefthook >= 2.0.5: older versions would run the pre-push
# gate with no files and skip it silently, so refuse them loudly instead.
min_version: 2.0.5

# Compact output: the default banner buries the one error that matters when
# stdout is redirected (agents, CI, `git push 2>&1`).
output:
  - summary
  - execution_out
  - failure

pre-commit:
  parallel: true
  jobs:
    - name: gitleaks-staged
      script: gitleaks-staged.sh
      runner: sh
    - name: block-env-files
      script: block-env-files.sh
      runner: sh
    - name: loc-warning
      script: loc-warning.sh
      runner: sh
    - name: lint-health-staged
      script: lint-health-staged.sh
      runner: sh
    - name: lockfile-canary-nudge
      script: lockfile-canary-nudge.sh
      runner: sh
    - name: default-branch-nudge
      script: default-branch-nudge.sh
      runner: sh

pre-push:
  parallel: false
  jobs:
    - name: docs-nudge
      script: docs-nudge.sh
      runner: sh
      args: "{push_files}"
    - name: tasks-archive-nudge
      script: tasks-archive-nudge.sh
      runner: sh
    - name: gitleaks-pushed
      script: gitleaks-pushed.sh
      runner: sh
      use_stdin: true
    - name: ship-config-gate
      script: ship-config-gate.sh
      runner: sh
      args: "{push_files}"

commit-msg:
  jobs:
    - name: strip-agent-attribution
      script: strip-agent-attribution.sh
      runner: sh
