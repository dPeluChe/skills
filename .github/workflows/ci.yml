name: ci

# Runs the hook suite on macOS — the platform flowkit actually targets (agents
# and devs are on macOS/BSD; the suite has never been ported to Linux/GNU). The
# suite is network-free (00-helpers.sh points lefthook `remotes` at a local
# git_url), so CI never clones from github and never hits a rate limit.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── the gate: one authoritative run; this is the check a PR must pass ───────
  gate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools (shellcheck, gitleaks, lefthook)
        run: brew install shellcheck gitleaks lefthook

      - name: Tool versions
        run: |
          shellcheck --version | head -2
          lefthook version
          gitleaks version
          python3 --version
          bash --version | head -1

      # fixture retention policy: scripts/tests/00-helpers.sh
      - name: Run hook suite
        run: |
          set -o pipefail
          bash scripts/test-hooks.sh 2>&1 | tee "$RUNNER_TEMP/suite.out"

      - name: Collect fixture logs (failure only)
        if: failure()
        run: bash scripts/collect-fixture-logs.sh "$RUNNER_TEMP/suite.out" "$RUNNER_TEMP/diag"

      - name: Upload fixture logs (failure only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate-diag-${{ github.run_id }}
          path: ${{ runner.temp }}/diag
          if-no-files-found: warn

  # ── diagnose (manual): the green-run counterpart of gate's failure artifact.
  diagnose:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools (shellcheck, gitleaks, lefthook)
        run: brew install shellcheck gitleaks lefthook

      # FLOWKIT_KEEP_TMP forces keeping fixtures even on a GREEN run: that is the
      # one thing gate cannot give you, and the reason this manual job exists.
      - name: Run suite (keep fixtures even when green)
        env:
          FLOWKIT_KEEP_TMP: "1"
        run: bash scripts/test-hooks.sh 2>&1 | tee "$RUNNER_TEMP/suite.out" || true

      - name: Collect fixture logs
        if: always()
        run: bash scripts/collect-fixture-logs.sh "$RUNNER_TEMP/suite.out" "$RUNNER_TEMP/diag"

      - name: Upload fixture logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixture-diag
          path: ${{ runner.temp }}/diag
          if-no-files-found: warn
